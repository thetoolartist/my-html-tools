        function setCategory(category) {
            selectedCategory = category;
            searchReplies();
        }

        function highlightText(text, query) {
            if (!query) return text;
            const regex = new RegExp(query, 'gi');
            return text.replace(regex, match => `<span class="highlight">${match}</span>`);
        }

        function searchReplies() {
            const query = document.getElementById("searchBox").value.toLowerCase();
            const resultsDiv = document.getElementById("results");
            resultsDiv.innerHTML = "";

            const filteredReplies = replies[selectedCategory].filter(reply =>
                reply.title.toLowerCase().includes(query) || reply.body.toLowerCase().includes(query)
            );

            (query ? filteredReplies : replies[selectedCategory]).forEach((reply, index) => {
                const replyDiv = document.createElement("div");
                replyDiv.classList.add("reply");

                const replyBodyHTML = highlightText(reply.body.replace(/\n/g, "<br>"), query);
                const escapedBody = reply.body.replace(/"/g, '&quot;');

                replyDiv.innerHTML = `
                    <strong>${index + 1}. ${reply.title}</strong>
                    <p>${replyBodyHTML}</p>
                    <button class="copy-btn" data-reply="${escapedBody}" onclick="copyToClipboard(this)">Copy</button>
                `;
                resultsDiv.appendChild(replyDiv);
            });
        }

        function copyToClipboard(buttonElement) {
            const text = buttonElement.getAttribute("data-reply");
            navigator.clipboard.writeText(text).catch(err => console.error("Error copying text: ", err));
        }

        searchReplies();
    </script>
